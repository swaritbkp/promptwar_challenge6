ous">Back</button><button id="story-next-btn" class="btn btn-sm btn-primary" aria-label="Next">Next</button><button id="story-close-btn" class="btn btn-sm btn-secondary" aria-label="Exit">✕</button></div></aside><script type="module" src="/static/js/app.js"></script></body></html>
